name: K0 specification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 26.4.0

      - name: Set up Python
        uses: actions/setup-python@v7.0.0
        with:
          python-version: 3.9.25

      - name: Validate executable specification
        run: npm test

      - name: Require generated evidence to be committed
        run: git diff --exit-code -- spec/manifests/spec.lock.json reports/G0.json reports/G0.md

  proof-fragment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Build and independently check Lean declarations
        uses: leanprover/lean-action@v1.5.0
        with:
          build: true
          test: false
          lint: false
          leanchecker: true
          nanoda: true
          nanoda-allow-sorry: false
          use-mathlib-cache: false
