name: K0 specification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: spec-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26.4.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.9.25

      - name: Validate executable specification
        run: npm test

      - name: Require generated evidence to be committed
        run: git diff --exit-code -- spec/manifests/spec.lock.json reports/G0.json reports/G0.md

  proof-fragment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build and independently check Lean declarations
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1.5.0
        with:
          build: true
          test: false
          lint: false
          leanchecker: false
          nanoda: false
          use-mathlib-cache: false

      - name: Install locked Rust checker toolchain
        run: rustup toolchain install 1.85.0 --profile minimal --no-self-update

      - name: Replay with pinned lean4checker
        run: bash tools/check-lean4checker.sh

      - name: Replay with pinned nanoda checker
        run: bash tools/check-nanoda.sh
